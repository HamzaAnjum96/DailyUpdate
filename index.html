<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>City Ops Brief</title>
<meta name="description" content="Manchester travel, news, sales and events for the week, as a swipeable trading-card deck.">
<meta name="theme-color" content="#090909">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/deck.css">
<script type="module" src="assets/js/main.js"></script>
</head>
<body>
<div id="app" aria-busy="true"><div class="load-error" role="status">Loading the latest brief…</div></div>
<script>
  // Browsers block module scripts and fetch() on file:// pages, so say how to preview instead.
  if (location.protocol === 'file:') {
    document.getElementById('app').removeAttribute('aria-busy');
    document.getElementById('app').innerHTML = '<div class="load-error"><b>Serve this folder to preview</b>Run <code>python3 -m http.server</code> in the repo and open http://localhost:8000.</div>';
  }
</script>
<noscript><style>#app{display:none}</style><div class="load-error"><b>JavaScript needed</b>The deck is built in the browser from data/briefs/*.json.</div></noscript>
</body>
</html>
